
<!DOCTYPE html>



<html>
    <head>
        <script src="../../resources/js/jquery-1.8.2.js"></script>
        <link href="../../resources/css/vendor/mainstyle.css" rel="stylesheet">
        <link href="../../resources/css/vendor/all.css" rel="stylesheet" type="text/css">
        <script src="../../resources/js/vendor/jquery.min.js"></script>
        <script>
            var url = '../../students/transaction/studentHostelBookingInner.jsp';

            $(function () {
                hostelOpenCheck();
            });

            function hostelOpenCheck() {
                var datevalue = $("#hidchkHostelOpen").val();
                if (datevalue.length < 1) {
                    var AJAXparameter = [];
                    AJAXparameter.push({name: "iden", value: "7"});
                    $.post(url, AJAXparameter, function (data, status) {
                        var msg = data.toString();
                        if (msg.trim().length <= 1) {
                            var dummydate = new Date();
                            dummydate.setDate(dummydate.getDate() + 2);
                            $("#hidchkHostelOpen").val(dummydate);
                        } else {
                            $("#hidchkHostelOpen").val(msg.trim());
                        }
                        var datevalue1 = $("#hidchkHostelOpen").val();
                        var d1 = new Date(datevalue1);
                        var d2 = new Date();
                        if (d2 >= d1) {
                            redirectHostelFace();
                        } else {
                            alert('Booking will open on scheduled time');
                        }
                    }, "html");

                } else {
                    var d1 = new Date(datevalue);
                    var d2 = new Date();
                    if (d2 >= d1) {
                        redirectHostelFace();
                    } else {
                        $("#divAlertBookingBody").html("Booking will open on scheduled time");
                        $('#hostelbookingModal1').modal('show');
//                        alert('Booking will open on scheduled time');
//                        redirectToBlock();
                    }
                }
            }
            //14	"Hostel Booking"	"../../students/transaction/HostelRegistrationInitiation.jsp"    
            //25	"Hostel Booking Inner"	"../../students/transaction/HostelBookingBlocked.jsp"
            //26	"Hostel Face "	"../../students/transaction/HostelFace.jsp"

            function redirectHostelFace() {
                $('#hdnFormId').val(26);
                $("#userHomePage").attr("action", "../../students/template/HRDSystem.jsp");
                $("#userHomePage").submit();
            }
        </script>
    </head>
    <body>
        <div class="container mt-4">
            <div class="alert alert-info alert-dismissible fade show" align="center">
                <i class="fas fa-info-circle"></i> <strong>Welcome to SRM Hostel Booking</strong>  
            </div>
            <div align="center">
                <button align="center" type="button"  class="btn btn-custom rounded-pill lift" onclick="hostelOpenCheck()">
                    Click to Proceed
                </button>
            </div>
        </div>
        <div class="modal fade" id="hostelbookingModal1" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
             aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Hostel Booking</h5>
                        <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                            <span class="text-white" aria-hidden="true">×</span>
                        </button>
                    </div>
                    <div class="modal-body" id="divAlertBookingBody">
                        Select hostel
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-dark lift" type="button" data-dismiss="modal">Ok</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="../../resources/js/vendor/bootstrap.bundle.min.js"></script>
        <script src="../../resources/js/vendor/jquery.easing.min.js"></script>
        <script src="../../resources/js/vendor/main.js"></script>
    </body>

</html>
