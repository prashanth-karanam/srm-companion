<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_cosmic_prismatic_galaxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f5d0fe" />
      <stop offset="70%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <linearGradient id="gem_frame_cosmic_prismatic_galaxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <filter id="f_frame_cosmic_prismatic_galaxy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_cosmic_prismatic_galaxy { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #d946ef);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #d946ef);} }
    @keyframes sp_frame_cosmic_prismatic_galaxy { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_cosmic_prismatic_galaxy { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_cosmic_prismatic_galaxy { transform-origin:60px 24px; animation:fl_frame_cosmic_prismatic_galaxy 3s ease-in-out infinite; }
    .s_frame_cosmic_prismatic_galaxy { transform-origin:60px 60px; animation:sp_frame_cosmic_prismatic_galaxy 14s linear infinite; }
    .p_frame_cosmic_prismatic_galaxy { transform-origin:center; animation:pu_frame_cosmic_prismatic_galaxy 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_cosmic_prismatic_galaxy"><circle cx="60" cy="60" r="53" stroke="url(#g_frame_cosmic_prismatic_galaxy)" stroke-width="2.8" fill="none" stroke-dasharray="16 8 4 8" filter="url(#f_frame_cosmic_prismatic_galaxy)" /><circle cx="60" cy="60" r="56" stroke="#f5d0fe" stroke-width="1.2" fill="none" stroke-dasharray="2 14" opacity="0.7" /></g>
  <g class="c_frame_cosmic_prismatic_galaxy" filter="url(#f_frame_cosmic_prismatic_galaxy)"><path d="M36,28 Q60,35 84,28 L82,16 L70,22 L60,8 L50,22 L38,16 Z" fill="url(#g_frame_cosmic_prismatic_galaxy)" stroke="#701a75" stroke-width="1" stroke-linejoin="round" /><polygon points="60,14 65,20 60,26 55,20" fill="url(#gem_frame_cosmic_prismatic_galaxy)" stroke="#ffffff" stroke-width="0.8" /><circle cx="46" cy="22" r="2.5" fill="#38bdf8" /><circle cx="74" cy="22" r="2.5" fill="#38bdf8" /><circle cx="60" cy="8" r="3.2" fill="#ffffff" /><circle cx="38" cy="16" r="2" fill="#f5d0fe" /><circle cx="82" cy="16" r="2" fill="#f5d0fe" /></g>
  <g filter="url(#f_frame_cosmic_prismatic_galaxy)"><polygon points="60,96 70,104 60,116 50,104" fill="url(#gem_frame_cosmic_prismatic_galaxy)" stroke="#ffffff" stroke-width="1" /><circle cx="38" cy="98" r="2" fill="#f5d0fe" /><circle cx="82" cy="98" r="2" fill="#f5d0fe" /></g>
  <g class="p_frame_cosmic_prismatic_galaxy" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_cosmic_prismatic_galaxy" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
</svg>