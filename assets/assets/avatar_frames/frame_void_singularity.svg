<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="voidGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes vortexSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes voidPulse {
      0%, 100% { filter: drop-shadow(0 0 6px #c084fc); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #e879f9); transform: scale(1.03); }
    }
    .vortex { transform-origin: 60px 60px; animation: vortexSpin 14s linear infinite; }
    .void-body { transform-origin: 60px 60px; animation: voidPulse 3.5s ease-in-out infinite; }
  </style>

  <g class="void-body">
    <g class="vortex">
      <circle cx="60" cy="60" r="53" stroke="url(#voidGrad)" stroke-width="3.2" fill="none" stroke-dasharray="32 8 16 8" filter="url(#voidGlow)" />
      <!-- Orbiting Celestial Moons -->
      <circle cx="60" cy="6" r="3.5" fill="#f472b6" filter="drop-shadow(0 0 6px #f472b6)" />
      <circle cx="60" cy="114" r="2.5" fill="#c084fc" />
      <circle cx="6" cy="60" r="2.5" fill="#818cf8" />
      <circle cx="114" cy="60" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 6px #ffffff)" />
    </g>
  </g>
</svg>