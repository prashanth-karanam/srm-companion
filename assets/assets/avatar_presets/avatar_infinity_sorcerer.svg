<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gojoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="hollowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <style>
    @keyframes purplePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #a855f7); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 12px #ec4899); }
    }
    .gojo-orb { transform-origin: 50px 72px; animation: purplePulse 2s ease-in-out infinite; }
  </style>
  <circle cx="50" cy="50" r="50" fill="url(#gojoBg)" />
  <!-- White Spiky Hair -->
  <path d="M24,42 Q30,16 50,14 Q70,16 76,42 Q65,28 50,30 Q35,28 24,42 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- Blindfold -->
  <rect x="25" y="38" width="50" height="16" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <!-- Glowing Eye Peeking -->
  <circle cx="40" cy="46" r="3" fill="#38bdf8" opacity="0.95" />
  <circle cx="40" cy="46" r="1" fill="#ffffff" />
  <!-- High Collar Uniform -->
  <path d="M30,56 L50,64 L70,56 L74,85 L26,85 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Hollow Purple Sphere -->
  <circle class="gojo-orb" cx="50" cy="74" r="8" fill="url(#hollowPurple)" />
</svg>