<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_cyber_overdrive_plasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="gem_frame_cyber_overdrive_plasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <filter id="f_frame_cyber_overdrive_plasma" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_cyber_overdrive_plasma { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #f97316);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #f97316);} }
    @keyframes sp_frame_cyber_overdrive_plasma { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_cyber_overdrive_plasma { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_cyber_overdrive_plasma { transform-origin:60px 24px; animation:fl_frame_cyber_overdrive_plasma 3s ease-in-out infinite; }
    .s_frame_cyber_overdrive_plasma { transform-origin:60px 60px; animation:sp_frame_cyber_overdrive_plasma 14s linear infinite; }
    .p_frame_cyber_overdrive_plasma { transform-origin:center; animation:pu_frame_cyber_overdrive_plasma 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_cyber_overdrive_plasma"><circle cx="60" cy="60" r="54" stroke="url(#g_frame_cyber_overdrive_plasma)" stroke-width="2" fill="none" stroke-dasharray="24 8 4 8" filter="url(#f_frame_cyber_overdrive_plasma)" /><circle cx="60" cy="60" r="57" stroke="#fed7aa" stroke-width="1" fill="none" stroke-dasharray="2 18" /></g>
  <g filter="url(#f_frame_cyber_overdrive_plasma)"><path d="M40,16 L48,10 L72,10 L80,16" stroke="url(#g_frame_cyber_overdrive_plasma)" stroke-width="3" fill="none" /><rect x="56" y="8" width="8" height="4" fill="#38bdf8" /><path d="M40,104 L48,110 L72,110 L80,104" stroke="url(#g_frame_cyber_overdrive_plasma)" stroke-width="3" fill="none" /><rect x="56" y="108" width="8" height="4" fill="#38bdf8" /><line x1="8" y1="60" x2="18" y2="60" stroke="#fed7aa" stroke-width="2" /><line x1="102" y1="60" x2="112" y2="60" stroke="#fed7aa" stroke-width="2" /><polygon points="12,56 16,60 12,64" fill="#38bdf8" /><polygon points="108,56 104,60 108,64" fill="#38bdf8" /></g>
  <g class="p_frame_cyber_overdrive_plasma" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_cyber_overdrive_plasma" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
</svg>