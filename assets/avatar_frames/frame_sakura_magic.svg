<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f472b6" />
      <stop offset="80%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <filter id="sakuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes magicRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes petalFloat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #f472b6); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 16px #fbcfe8); }
    }
    .sakura-ring { transform-origin: 60px 60px; animation: magicRotate 22s linear infinite; }
    .sakura-core { transform-origin: 60px 60px; animation: petalFloat 3s ease-in-out infinite; }
  </style>

  <g class="sakura-core">
    <g class="sakura-ring">
      <circle cx="60" cy="60" r="53" stroke="url(#sakuraGrad)" stroke-width="2.6" fill="none" stroke-dasharray="20 8 6 8" filter="url(#sakuraGlow)" />
      <!-- Sakura Blossom Petals -->
      <circle cx="60" cy="6" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 5px #f472b6)" />
      <circle cx="60" cy="114" r="3" fill="#f472b6" />
      <circle cx="6" cy="60" r="3" fill="#f472b6" />
      <circle cx="114" cy="60" r="3" fill="#f472b6" />
    </g>
    <!-- Crescent Moon Tiara -->
    <path d="M52,8 C54,16 66,16 68,8 C64,12 56,12 52,8 Z" fill="#ffffff" filter="url(#sakuraGlow)" />
  </g>
</svg>