<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="gemRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="royalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes crownFloat {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 8px #d97706); }
      50% { transform: translateY(-3px) scale(1.04); filter: drop-shadow(0 0 18px #eab308); }
    }
    @keyframes ringSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes particleSparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .crown-core { transform-origin: 60px 22px; animation: crownFloat 2.8s ease-in-out infinite; }
    .spinning-halo { transform-origin: 60px 60px; animation: ringSpin 12s linear infinite; }
    .sparkle-node { transform-origin: center; animation: particleSparkle 1.8s ease-in-out infinite; }
  </style>

  <!-- Pulsing Solar Flare Outer Halo -->
  <g class="spinning-halo">
    <circle cx="60" cy="60" r="53" stroke="url(#goldGrad)" stroke-width="2.8" fill="none" stroke-dasharray="16 8 4 8" filter="url(#royalGlow)" />
    <circle cx="60" cy="60" r="56" stroke="rgba(253, 224, 71, 0.4)" stroke-width="1.2" fill="none" stroke-dasharray="2 12" />
  </g>

  <!-- Twinkling Solar Flares -->
  <g class="sparkle-node" style="transform-origin: 18px 28px;">
    <path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #fef08a)" />
  </g>
  <g class="sparkle-node" style="transform-origin: 102px 28px; animation-delay: 0.9s;">
    <path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #fef08a)" />
  </g>
  <g class="sparkle-node" style="transform-origin: 60px 110px; animation-delay: 0.45s;">
    <path d="M60,105 L61.2,108.8 L65,110 L61.2,111.2 L60,115 L58.8,111.2 L55,110 L58.8,108.8 Z" fill="#d97706" />
  </g>

  <!-- 24K Sovereign Imperial Crown -->
  <g class="crown-core" filter="url(#royalGlow)">
    <path d="M36,28 Q60,35 84,28 L82,33 Q60,39 38,33 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
    <path d="M36,28 L32,14 L46,23 L60,8 L74,23 L88,14 L84,28 Q60,35 36,28 Z" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Ruby Heart Inlays -->
    <polygon points="60,14 64,19 60,25 56,19" fill="url(#gemRuby)" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="46" cy="21" r="2.5" fill="url(#gemRuby)" stroke="#ffe4e6" stroke-width="0.6" />
    <circle cx="74" cy="21" r="2.5" fill="url(#gemRuby)" stroke="#ffe4e6" stroke-width="0.6" />
    <!-- Scepter Diamond Tip -->
    <circle cx="60" cy="8" r="3.2" fill="#ffffff" filter="drop-shadow(0 0 5px #ffffff)" />
    <circle cx="32" cy="14" r="2.2" fill="#fef08a" />
    <circle cx="88" cy="14" r="2.2" fill="#fef08a" />
  </g>
</svg>