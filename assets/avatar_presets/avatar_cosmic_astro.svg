<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="astroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="visorGalaxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <style>
    @keyframes astroFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    .astro-anim { transform-origin: 50px 50px; animation: astroFloat 4s ease-in-out infinite; }
  </style>
  <circle cx="50" cy="50" r="50" fill="url(#astroBg)" />
  <!-- Distant Stars -->
  <circle cx="20" cy="24" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="80" cy="20" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="86" cy="74" r="1.5" fill="#38bdf8" opacity="0.8" />
  <g class="astro-anim">
    <!-- Astronaut Helmet Outer Ring -->
    <circle cx="50" cy="50" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- Visor Reflecting Nebula -->
    <ellipse cx="50" cy="50" rx="20" ry="16" fill="url(#visorGalaxy)" filter="drop-shadow(0 0 6px #8b5cf6)" />
    <!-- Visor Glare -->
    <path d="M38,40 Q50,36 58,40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>