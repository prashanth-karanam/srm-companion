<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="valGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="valCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="valGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <!-- Top Radiant Apex Diamond Triangle -->
  <g filter="url(#valGlow)">
    <polygon points="80,10 94,32 66,32" fill="url(#valGold)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="2s" repeatCount="indefinite" />
    </polygon>
    <polygon points="80,16 88,30 72,30" fill="url(#valCyan)" />
    <!-- Bottom Anchor Spike -->
    <polygon points="80,150 90,132 70,132" fill="url(#valGold)" />
    <!-- Left & Right Diamond Crystals -->
    <polygon points="12,80 30,70 30,90" fill="url(#valGold)" />
    <polygon points="148,80 130,70 130,90" fill="url(#valGold)" />
  </g>
  <!-- Rotating Radiant Shards Orbit -->
  <g filter="url(#valGlow)">
    <circle cx="80" cy="80" r="54" fill="none" stroke="url(#valGold)" stroke-width="3" stroke-dasharray="24 8">
      <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="80" r="50" fill="none" stroke="url(#valCyan)" stroke-width="2" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>