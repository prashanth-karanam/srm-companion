<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
    
    <defs>
      <linearGradient id="jjk_blue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
      <linearGradient id="jjk_red" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#be123c"/></linearGradient>
      <filter id="jjk_glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#jjk_glow)">
      <circle cx="80" cy="80" r="54" fill="none" stroke="url(#jjk_blue)" stroke-width="3" stroke-dasharray="35 20"><animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="80" r="54" fill="none" stroke="url(#jjk_red)" stroke-width="3" stroke-dasharray="20 35"><animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="80" r="50" fill="none" stroke="#c084fc" stroke-width="2"><animate attributeName="stroke-width" values="1.5;3.5;1.5" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    
    </svg>