<script>
    var url = '../../students/transaction/HostelUpgradeWillingnessInner.jsp';
    function funSave(type) {
        var upgradeStatus = 0;
        var roomType = "";
        if (type == 'upgrade') {
            if (!$("#chkHostelUpgrade").is(":checked")) {
                alert("Please mark the willingness checkbox.");
                return false;
            }
            upgradeStatus = 1;
        }
        if (type == 'willingness') {
            if (!$("#chkHostelWillingness").is(":checked")) {
                alert("Please mark the willingness checkbox.");
                return false;
            }

            if (!$("input[name='radRoomType']").is(":checked")) {
                alert("Please select a room type (AC or Non-AC).");
                return false;
            }

            roomType = $("input[name='radRoomType']:checked").val();
            upgradeStatus = 1;
        }
        var ajaxParameter = [];
        if (type == 'upgrade') {
            ajaxParameter.push({name: "iden", value: 3});
            ajaxParameter.push({name: "hdnAcademicYearId", value: $("#hdnAcademicYearId_upgrade").val()});
        }
        if (type == 'willingness') {
            ajaxParameter.push({name: "iden", value: 4});
            ajaxParameter.push({name: "RoomType", value: roomType});
        }
        ajaxParameter.push({name: "UpgradeStatus", value: upgradeStatus});
        $("#divResult_" + type).html("<img src='../../resources/Image/wait.gif' alt='Loading... Please wait..'>");
        $.post(url, ajaxParameter, function (data, status) {
            if (data.resultstatus == 1) {
                $("#divResult_" + type).html("<div class='alert alert-success w-100 mb-0 mt-3 text-center'>" + data.result + "</div>");
                $("#btnSave_" + type).hide();
                if (type == 'upgrade') {
                    $("#chkHostelUpgrade").prop("checked", false);
                }
                if (type == 'willingness') {
                    $("#chkHostelWillingness").prop("checked", false);
                }
            } else {
                $("#divResult_" + type).html(
                        "<div class='alert alert-danger w-100 mb-0 mt-3 text-center'>" + data.result + "</div>");
                $("#btnSave_" + type).show();
            }
        }, "json");
    }
    function funReset() {
        document.location.reload(true);
    }

</script>
