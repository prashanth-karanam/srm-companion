<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="plasmaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes lightningZap {
      0%, 100% { opacity: 0.7; transform: scale(1); filter: drop-shadow(0 0 8px #38bdf8); }
      20% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 18px #06b6d4); }
      40% { opacity: 0.6; }
      60% { opacity: 1; filter: drop-shadow(0 0 24px #ffffff); }
    }
    .plasma-core { transform-origin: 60px 60px; animation: lightningZap 2s ease-in-out infinite; }
  </style>

  <g class="plasma-core">
    <!-- Plasma Ring -->
    <circle cx="60" cy="60" r="53" stroke="url(#plasmaGrad)" stroke-width="2.8" fill="none" stroke-dasharray="18 4 6 4" filter="url(#plasmaGlow)" />
    <!-- Lightning Arcs -->
    <path d="M50,8 L58,16 L54,20 L66,12 L60,4 Z" fill="#ffffff" filter="url(#plasmaGlow)" />
    <path d="M12,50 L20,58 L16,62 L26,52 Z" fill="#ffffff" filter="url(#plasmaGlow)" />
    <path d="M108,50 L100,58 L104,62 L94,52 Z" fill="#ffffff" filter="url(#plasmaGlow)" />
    <circle cx="60" cy="6" r="3.2" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />
  </g>
</svg>