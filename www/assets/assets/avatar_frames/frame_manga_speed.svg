<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="holoRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="holoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes rainbowShift {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes diamondGleam {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .rainbow-ring { transform-origin: 60px 60px; animation: rainbowShift 6s linear infinite; }
    .sparkle { transform-origin: center; animation: diamondGleam 2s ease-in-out infinite; }
  </style>

  <g class="rainbow-ring">
    <circle cx="60" cy="60" r="53" stroke="url(#holoRainbow)" stroke-width="3" fill="none" stroke-dasharray="16 8 8 8" filter="url(#holoGlow)" />
  </g>
  <g class="sparkle" style="transform-origin: 60px 10px;">
    <polygon points="60,4 64,10 60,16 56,10" fill="#ffffff" filter="drop-shadow(0 0 6px #ffffff)" />
  </g>
  <g class="sparkle" style="transform-origin: 20px 80px; animation-delay: 0.7s;">
    <polygon points="20,76 23,80 20,84 17,80" fill="#ffffff" />
  </g>
  <g class="sparkle" style="transform-origin: 100px 80px; animation-delay: 1.2s;">
    <polygon points="100,76 103,80 100,84 97,80" fill="#ffffff" />
  </g>
</svg>