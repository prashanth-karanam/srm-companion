  <g class="p_frame_campus_100_attendance" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
