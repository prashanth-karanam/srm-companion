  <g filter="url(#f_frame_campus_100_attendance)"><circle cx="60" cy="104" r="8" fill="url(#g_frame_campus_100_attendance)" stroke="#ffffff" stroke-width="1" /><polygon points="60,99 62,103 66,104 63,107 64,111 60,109 56,111 57,107 54,104 58,103" fill="#fbbf24" /></g>
