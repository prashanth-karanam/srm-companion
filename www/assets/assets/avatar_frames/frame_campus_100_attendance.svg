<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_campus_100_attendance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a7f3d0" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gem_frame_campus_100_attendance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="f_frame_campus_100_attendance" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_campus_100_attendance { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #10b981);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #10b981);} }
    @keyframes sp_frame_campus_100_attendance { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_campus_100_attendance { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_campus_100_attendance { transform-origin:60px 24px; animation:fl_frame_campus_100_attendance 3s ease-in-out infinite; }
    .s_frame_campus_100_attendance { transform-origin:60px 60px; animation:sp_frame_campus_100_attendance 14s linear infinite; }
    .p_frame_campus_100_attendance { transform-origin:center; animation:pu_frame_campus_100_attendance 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_campus_100_attendance"><circle cx="60" cy="60" r="54" stroke="url(#g_frame_campus_100_attendance)" stroke-width="2.5" fill="none" stroke-dasharray="16 8 4 8" filter="url(#f_frame_campus_100_attendance)" /></g>
