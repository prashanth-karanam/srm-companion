<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_rpg_dungeon_master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f3e8ff" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gem_frame_rpg_dungeon_master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="f_frame_rpg_dungeon_master" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_rpg_dungeon_master { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #a855f7);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #a855f7);} }
    @keyframes sp_frame_rpg_dungeon_master { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_rpg_dungeon_master { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_rpg_dungeon_master { transform-origin:60px 24px; animation:fl_frame_rpg_dungeon_master 3s ease-in-out infinite; }
    .s_frame_rpg_dungeon_master { transform-origin:60px 60px; animation:sp_frame_rpg_dungeon_master 14s linear infinite; }
    .p_frame_rpg_dungeon_master { transform-origin:center; animation:pu_frame_rpg_dungeon_master 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_rpg_dungeon_master"><circle cx="60" cy="60" r="53" stroke="url(#g_frame_rpg_dungeon_master)" stroke-width="2.8" fill="none" stroke-dasharray="16 8 4 8" filter="url(#f_frame_rpg_dungeon_master)" /><circle cx="60" cy="60" r="56" stroke="#f3e8ff" stroke-width="1.2" fill="none" stroke-dasharray="2 14" opacity="0.7" /></g>
  <g class="c_frame_rpg_dungeon_master" filter="url(#f_frame_rpg_dungeon_master)"><path d="M36,28 Q60,35 84,28 L82,16 L70,22 L60,8 L50,22 L38,16 Z" fill="url(#g_frame_rpg_dungeon_master)" stroke="#3b0764" stroke-width="1" stroke-linejoin="round" /><polygon points="60,14 65,20 60,26 55,20" fill="url(#gem_frame_rpg_dungeon_master)" stroke="#ffffff" stroke-width="0.8" /><circle cx="46" cy="22" r="2.5" fill="#fde047" /><circle cx="74" cy="22" r="2.5" fill="#fde047" /><circle cx="60" cy="8" r="3.2" fill="#ffffff" /><circle cx="38" cy="16" r="2" fill="#f3e8ff" /><circle cx="82" cy="16" r="2" fill="#f3e8ff" /></g>
  <g filter="url(#f_frame_rpg_dungeon_master)"><polygon points="60,96 70,104 60,116 50,104" fill="url(#gem_frame_rpg_dungeon_master)" stroke="#ffffff" stroke-width="1" /><circle cx="38" cy="98" r="2" fill="#f3e8ff" /><circle cx="82" cy="98" r="2" fill="#f3e8ff" /></g>
  <g class="p_frame_rpg_dungeon_master" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_rpg_dungeon_master" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
