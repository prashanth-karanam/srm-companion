<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="iceGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes frostPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #38bdf8); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 16px #bae6fd); }
    }
    @keyframes rotateRune {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ice-rune-orbit { transform-origin: 60px 60px; animation: rotateRune 20s linear infinite; }
    .ice-core { transform-origin: 60px 60px; animation: frostPulse 3s ease-in-out infinite; }
  </style>

  <g class="ice-core">
    <!-- Outer Ice Crystal Ring -->
    <circle cx="60" cy="60" r="53" stroke="url(#iceGrad)" stroke-width="3" fill="none" stroke-dasharray="14 6 2 6" filter="url(#iceGlow)" />
    <!-- Inner Glacier Shards -->
    <g class="ice-rune-orbit">
      <polygon points="60,3 64,12 56,12" fill="url(#iceGrad)" />
      <polygon points="60,117 64,108 56,108" fill="url(#iceGrad)" />
      <polygon points="3,60 12,64 12,56" fill="url(#iceGrad)" />
      <polygon points="117,60 108,64 108,56" fill="url(#iceGrad)" />
      <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="drop-shadow(0 0 3px #7dd3fc)" />
      <circle cx="96" cy="24" r="2.5" fill="#ffffff" filter="drop-shadow(0 0 3px #7dd3fc)" />
      <circle cx="24" cy="96" r="2.5" fill="#ffffff" filter="drop-shadow(0 0 3px #7dd3fc)" />
      <circle cx="96" cy="96" r="2.5" fill="#ffffff" filter="drop-shadow(0 0 3px #7dd3fc)" />
    </g>
    <!-- Top Icicle Crown Tiara -->
    <g filter="url(#iceGlow)">
      <polygon points="60,8 65,24 55,24" fill="#ffffff" stroke="#38bdf8" stroke-width="0.8" />
      <polygon points="46,16 51,26 43,26" fill="url(#iceGrad)" />
      <polygon points="74,16 77,26 69,26" fill="url(#iceGrad)" />
    </g>
  </g>
</svg>