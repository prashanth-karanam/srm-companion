<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_dragon_infernal_wyrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fca5a5" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="gem_frame_dragon_infernal_wyrm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="f_frame_dragon_infernal_wyrm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_dragon_infernal_wyrm { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #ef4444);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #ef4444);} }
    @keyframes sp_frame_dragon_infernal_wyrm { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_dragon_infernal_wyrm { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_dragon_infernal_wyrm { transform-origin:60px 24px; animation:fl_frame_dragon_infernal_wyrm 3s ease-in-out infinite; }
    .s_frame_dragon_infernal_wyrm { transform-origin:60px 60px; animation:sp_frame_dragon_infernal_wyrm 14s linear infinite; }
    .p_frame_dragon_infernal_wyrm { transform-origin:center; animation:pu_frame_dragon_infernal_wyrm 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_dragon_infernal_wyrm"><circle cx="60" cy="60" r="54" stroke="url(#g_frame_dragon_infernal_wyrm)" stroke-width="2.5" fill="none" stroke-dasharray="14 6 2 6" filter="url(#f_frame_dragon_infernal_wyrm)" /><circle cx="60" cy="60" r="57" stroke="#fca5a5" stroke-width="0.8" fill="none" stroke-dasharray="3 14" opacity="0.6" /></g>
  <g class="c_frame_dragon_infernal_wyrm" filter="url(#f_frame_dragon_infernal_wyrm)"><path d="M42,26 Q60,34 78,26 L82,18 L70,22 L60,10 L50,22 L38,18 Z" fill="url(#g_frame_dragon_infernal_wyrm)" stroke="#7f1d1d" stroke-width="0.8" /><polygon points="60,14 65,22 60,28 55,22" fill="url(#gem_frame_dragon_infernal_wyrm)" /><circle cx="60" cy="10" r="2.5" fill="#ffffff" /><path d="M38,18 Q26,6 18,12 Q28,20 36,24 Z" fill="url(#g_frame_dragon_infernal_wyrm)" /><path d="M82,18 Q94,6 102,12 Q92,20 84,24 Z" fill="url(#g_frame_dragon_infernal_wyrm)" /></g>
  <g filter="url(#f_frame_dragon_infernal_wyrm)"><path d="M48,100 Q60,94 72,100 L68,108 Q60,104 52,108 Z" fill="url(#g_frame_dragon_infernal_wyrm)" /><polygon points="60,98 68,106 60,116 52,106" fill="url(#gem_frame_dragon_infernal_wyrm)" stroke="#ffffff" stroke-width="0.8" /><path d="M44,104 Q36,110 32,106 Q40,98 48,102 Z" fill="url(#g_frame_dragon_infernal_wyrm)" /><path d="M76,104 Q84,110 88,106 Q80,98 72,102 Z" fill="url(#g_frame_dragon_infernal_wyrm)" /></g>
  <g class="p_frame_dragon_infernal_wyrm" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_dragon_infernal_wyrm" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
</svg>