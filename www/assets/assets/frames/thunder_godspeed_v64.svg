<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g_thunder_godspeed_v64_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="f_thunder_godspeed_v64">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#f_thunder_godspeed_v64)">
    <!-- Top Apex Emblem -->
    <polygon points="80,12 88,28 72,28" fill="url(#g_thunder_godspeed_v64_1)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Outer Animated Rune Ring -->
    <circle cx="80" cy="80" r="54" fill="none" stroke="url(#g_thunder_godspeed_v64_1)" stroke-width="3.5" stroke-dasharray="12 18">
      <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="4.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Counter-Rotating Shards -->
    <circle cx="80" cy="80" r="49" fill="none" stroke="#facc15" stroke-width="1.8" stroke-dasharray="10 14" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="3.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>