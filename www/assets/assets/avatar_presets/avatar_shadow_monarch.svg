<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="monarchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="monarchEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <style>
    @keyframes shadowAura {
      0%, 100% { filter: drop-shadow(0 0 4px #6366f1); }
      50% { filter: drop-shadow(0 0 10px #38bdf8); }
    }
    .shadow-glow { animation: shadowAura 3s ease-in-out infinite; }
  </style>
  <circle cx="50" cy="50" r="50" fill="url(#monarchBg)" />
  <g class="shadow-glow">
    <!-- Shadow Cloak / Collar -->
    <path d="M20,80 Q35,45 50,60 Q65,45 80,80 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Hair Spikes -->
    <path d="M28,45 L35,22 L44,30 L50,15 L56,30 L65,22 L72,45 L62,40 L50,42 L38,40 Z" fill="#09090b" stroke="#6366f1" stroke-width="1.5" />
    <!-- Shadow Monarch Glowing Eyes -->
    <ellipse cx="42" cy="46" rx="6" ry="2.5" fill="url(#monarchEye)" />
    <ellipse cx="58" cy="46" rx="6" ry="2.5" fill="url(#monarchEye)" />
    <circle cx="43" cy="46" r="1.5" fill="#ffffff" />
    <circle cx="57" cy="46" r="1.5" fill="#ffffff" />
    <!-- Shadow Dagger Silhouette -->
    <polygon points="50,66 47,85 50,92 53,85" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>