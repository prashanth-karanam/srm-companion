<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <style>
    @keyframes matrixGlitch {
      0%, 100% { filter: drop-shadow(0 0 4px #10b981); }
      50% { filter: drop-shadow(0 0 8px #06b6d4); }
    }
    .hack-glow { animation: matrixGlitch 2.5s infinite; }
  </style>
  <circle cx="50" cy="50" r="50" fill="url(#hackBg)" />
  <g class="hack-glow">
    <!-- Hoodie Outline -->
    <path d="M24,78 C24,40 32,22 50,22 C68,22 76,40 76,78 Z" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Dark Inner Hood -->
    <path d="M32,74 C32,45 38,32 50,32 C62,32 68,45 68,74 Z" fill="#020617" />
    <!-- Cyber Neon Visor / Code Line -->
    <rect x="36" y="46" width="28" height="10" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="50" y="54" font-size="6" font-family="monospace" fill="#10b981" text-anchor="middle" font-weight="900">&gt;root_</text>
    <!-- Circuit lines on collar -->
    <line x1="42" y1="74" x2="42" y2="84" stroke="#10b981" stroke-width="1.5" />
    <line x1="58" y1="74" x2="58" y2="84" stroke="#10b981" stroke-width="1.5" />
    <circle cx="42" cy="84" r="2" fill="#10b981" />
    <circle cx="58" cy="84" r="2" fill="#10b981" />
  </g>
</svg>