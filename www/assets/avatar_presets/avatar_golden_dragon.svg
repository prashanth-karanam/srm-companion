<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dragonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <style>
    @keyframes dragonBreath {
      0%, 100% { filter: drop-shadow(0 0 3px #fde047); }
      50% { filter: drop-shadow(0 0 12px #f59e0b); }
    }
    .dragon-glow { animation: dragonBreath 2.5s ease-in-out infinite; }
  </style>
  <circle cx="50" cy="50" r="50" fill="url(#dragonBg)" />
  <g class="dragon-glow">
    <!-- Horns -->
    <path d="M34,36 C24,20 18,24 16,14 C26,20 32,28 38,36 Z" fill="url(#dragonGold)" />
    <path d="M66,36 C76,20 82,24 84,14 C74,20 68,28 62,36 Z" fill="url(#dragonGold)" />
    <!-- Dragon Head -->
    <path d="M36,40 L64,40 L58,74 L50,82 L42,74 Z" fill="url(#dragonGold)" stroke="#78350f" stroke-width="1.5" />
    <!-- Glowing Slit Eyes -->
    <polygon points="40,50 46,52 40,54" fill="#06b6d4" />
    <polygon points="60,50 54,52 60,54" fill="#06b6d4" />
  </g>
</svg>