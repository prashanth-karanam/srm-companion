<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="synthGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #d946ef); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #06b6d4); transform: scale(1.03); }
    }
    .synth-core { transform-origin: 60px 60px; animation: neonPulse 2.8s ease-in-out infinite; }
  </style>

  <g class="synth-core">
    <circle cx="60" cy="60" r="53" stroke="url(#synthGrad)" stroke-width="3" fill="none" stroke-dasharray="24 6 8 6" filter="url(#synthGlow)" />
    <!-- Horizon Neon Bars -->
    <line x1="20" y1="104" x2="100" y2="104" stroke="#f43f5e" stroke-width="2" />
    <line x1="30" y1="108" x2="90" y2="108" stroke="#d946ef" stroke-width="1.5" />
    <line x1="42" y1="112" x2="78" y2="112" stroke="#06b6d4" stroke-width="1.2" />
  </g>
</svg>