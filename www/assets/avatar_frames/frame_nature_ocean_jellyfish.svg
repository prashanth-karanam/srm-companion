<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_nature_ocean_jellyfish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f3e8ff" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="gem_frame_nature_ocean_jellyfish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="f_frame_nature_ocean_jellyfish" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_nature_ocean_jellyfish { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #a855f7);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #a855f7);} }
    @keyframes sp_frame_nature_ocean_jellyfish { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_nature_ocean_jellyfish { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_nature_ocean_jellyfish { transform-origin:60px 24px; animation:fl_frame_nature_ocean_jellyfish 3s ease-in-out infinite; }
    .s_frame_nature_ocean_jellyfish { transform-origin:60px 60px; animation:sp_frame_nature_ocean_jellyfish 14s linear infinite; }
    .p_frame_nature_ocean_jellyfish { transform-origin:center; animation:pu_frame_nature_ocean_jellyfish 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_nature_ocean_jellyfish"><circle cx="60" cy="60" r="54" stroke="url(#g_frame_nature_ocean_jellyfish)" stroke-width="2.6" fill="none" stroke-dasharray="28 12" filter="url(#f_frame_nature_ocean_jellyfish)" /><circle cx="60" cy="60" r="56" stroke="#f3e8ff" stroke-width="1.2" fill="none" stroke-dasharray="4 20" /></g>
  <g filter="url(#f_frame_nature_ocean_jellyfish)"><path d="M36,24 Q60,34 84,24 Q60,16 36,24 Z" fill="url(#g_frame_nature_ocean_jellyfish)" /><circle cx="60" cy="22" r="4.5" fill="url(#gem_frame_nature_ocean_jellyfish)" stroke="#ffffff" stroke-width="0.8" /><path d="M44,102 Q60,94 76,102 Q60,112 44,102 Z" fill="url(#g_frame_nature_ocean_jellyfish)" /><polygon points="60,96 66,104 60,112 54,104" fill="url(#gem_frame_nature_ocean_jellyfish)" /></g>
  <circle cx="16" cy="45" r="2" fill="#ffffff" class="p_frame_nature_ocean_jellyfish" /><circle cx="104" cy="45" r="2" fill="#ffffff" class="p_frame_nature_ocean_jellyfish" style="animation-delay:0.9s;" /><circle cx="60" cy="114" r="2.5" fill="#38bdf8" class="p_frame_nature_ocean_jellyfish" style="animation-delay:0.4s;" />
  <g class="p_frame_nature_ocean_jellyfish" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_nature_ocean_jellyfish" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
</svg>