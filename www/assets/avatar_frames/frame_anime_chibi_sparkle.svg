<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="g_frame_anime_chibi_sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="gem_frame_anime_chibi_sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="f_frame_anime_chibi_sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feGaussianBlur stdDeviation="1.2" result="b2" />
      <feMerge><feMergeNode in="b1" /><feMergeNode in="b2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fl_frame_anime_chibi_sparkle { 0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 8px #facc15);} 50%{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 16px #facc15);} }
    @keyframes sp_frame_anime_chibi_sparkle { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    @keyframes pu_frame_anime_chibi_sparkle { 0%,100%{opacity:0.3;transform:scale(0.8);} 50%{opacity:1;transform:scale(1.25);} }
    .c_frame_anime_chibi_sparkle { transform-origin:60px 24px; animation:fl_frame_anime_chibi_sparkle 3s ease-in-out infinite; }
    .s_frame_anime_chibi_sparkle { transform-origin:60px 60px; animation:sp_frame_anime_chibi_sparkle 14s linear infinite; }
    .p_frame_anime_chibi_sparkle { transform-origin:center; animation:pu_frame_anime_chibi_sparkle 2s ease-in-out infinite; }
  </style>

  <g class="s_frame_anime_chibi_sparkle"><circle cx="60" cy="60" r="53" stroke="url(#g_frame_anime_chibi_sparkle)" stroke-width="2.2" fill="none" stroke-dasharray="18 10 6 10" filter="url(#f_frame_anime_chibi_sparkle)" /><circle cx="60" cy="60" r="56" stroke="#fef08a" stroke-width="0.8" fill="none" stroke-dasharray="4 16" opacity="0.7" /></g>
  <g class="c_frame_anime_chibi_sparkle" filter="url(#f_frame_anime_chibi_sparkle)"><path d="M38,24 Q60,32 82,24 L86,16 Q60,24 34,16 Z" fill="url(#g_frame_anime_chibi_sparkle)" /><path d="M50,18 C46,12 40,14 42,20 C44,24 50,28 60,34 C70,28 76,24 78,20 C80,14 74,12 70,18 C66,14 62,14 60,18 C58,14 54,14 50,18 Z" fill="url(#gem_frame_anime_chibi_sparkle)" stroke="#ffffff" stroke-width="0.8" /><circle cx="60" cy="18" r="3" fill="#ffffff" /><circle cx="34" cy="16" r="2.2" fill="#ec4899" /><circle cx="86" cy="16" r="2.2" fill="#ec4899" /></g>
  <g class="p_frame_anime_chibi_sparkle" style="transform-origin:20px 30px;"><ellipse cx="20" cy="30" rx="3.5" ry="6" fill="#fef08a" transform="rotate(35 20 30)" /></g>
  <g class="p_frame_anime_chibi_sparkle" style="transform-origin:100px 32px;animation-delay:0.7s;"><ellipse cx="100" cy="32" rx="3.5" ry="6" fill="#fef08a" transform="rotate(-35 100 32)" /></g>
  <g class="p_frame_anime_chibi_sparkle" style="transform-origin:18px 28px;"><path d="M18,22 L19.5,26.5 L24,28 L19.5,29.5 L18,34 L16.5,29.5 L12,28 L16.5,26.5 Z" fill="#ffffff" /></g>
  <g class="p_frame_anime_chibi_sparkle" style="transform-origin:102px 28px;animation-delay:0.8s;"><path d="M102,22 L103.5,26.5 L108,28 L103.5,29.5 L102,34 L100.5,29.5 L96,28 L100.5,26.5 Z" fill="#ffffff" /></g>
</svg>