<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Complete Avatar & Banner Showcase (All 303 Items)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-base: #111214;
            --bg-elevated: #1e1f22;
            --bg-card: #2b2d31;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f2f3f5;
            --text-sub: #949ba4;
            --gold: #fbbf24;
            --purple: #c084fc;
            --blue: #38bdf8;
            --silver: #94a3b8;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .showcase-header {
            max-width: 1600px;
            margin: 0 auto 20px;
            padding: 18px 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .showcase-title-box h1 {
            margin: 0 0 4px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .showcase-title-box p {
            margin: 0;
            color: var(--text-sub);
            font-size: 0.82rem;
        }

        .main-tab-switcher {
            display: flex;
            gap: 8px;
            background: var(--bg-base);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .main-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-tab-btn.active {
            background: #5865f2;
            color: #fff;
            box-shadow: 0 2px 10px rgba(88, 101, 242, 0.4);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar {
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            width: 240px;
            outline: none;
        }

        .density-btn-group, .filter-btn-group {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .toggle-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .tier-section {
            max-width: 1600px;
            margin: 0 auto 30px;
        }

        .tier-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .tier-title {
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tier-count-pill {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 800;
        }

        /* Frame Grid */
        .showcase-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
        }

        .showcase-grid.density-compact {
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 8px;
        }

        .showcase-grid.density-comfortable {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        /* Banner Grid */
        .banners-showcase-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .banners-showcase-grid.density-compact {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .banners-showcase-grid.density-comfortable {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .frame-card, .banner-card {
            background: var(--bg-elevated);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .banner-card {
            align-items: stretch;
            text-align: left;
            padding: 8px;
        }

        .frame-card:hover, .banner-card:hover {
            transform: translateY(-2px);
        }

        /* Tier Glows */
        .tier-legendary {
            border-color: rgba(251, 191, 36, 0.35) !important;
            background: linear-gradient(180deg, rgba(251, 191, 36, 0.08) 0%, #1e1f22 100%) !important;
        }
        .tier-legendary:hover {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.4);
        }

        .tier-epic {
            border-color: rgba(192, 132, 252, 0.35) !important;
            background: linear-gradient(180deg, rgba(192, 132, 252, 0.08) 0%, #1e1f22 100%) !important;
        }
        .tier-epic:hover {
            border-color: #c084fc !important;
            box-shadow: 0 0 16px rgba(192, 132, 252, 0.4);
        }

        .tier-rare {
            border-color: rgba(56, 189, 248, 0.3) !important;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.06) 0%, #1e1f22 100%) !important;
        }
        .tier-rare:hover {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
        }

        .tier-common {
            border-color: rgba(148, 163, 184, 0.2) !important;
        }
        .tier-common:hover {
            border-color: #94a3b8 !important;
            box-shadow: 0 0 10px rgba(148, 163, 184, 0.3);
        }

        .avatar-circle-wrapper {
            position: relative;
            width: 58px;
            height: 58px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .avatar-base {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
            color: #fff;
        }

        .avatar-decoration-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 126%;
            height: 126%;
            object-fit: contain;
            pointer-events: none;
            z-index: 4;
        }

        .banner-preview-box {
            width: 100%;
            height: 72px;
            border-radius: 6px;
            margin-bottom: 8px;
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .frame-name, .banner-name {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 4px;
            word-break: break-word;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .frame-name {
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-row {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        .frame-card .badge-row {
            justify-content: center;
        }

        .tier-tag {
            font-size: 0.55rem;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .cat-tag {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .back-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            background: #5865f2;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 800;
            transition: background 0.15s ease;
        }

        .back-link-btn:hover {
            background: #4752c4;
        }
    </style>
</head>
<body>

    <div class="showcase-header">
        <div class="showcase-title-box">
            <h1>🌟 Complete Discord Customization Showcase</h1>
            <p>Every single animated ring and high-definition profile banner with full names & 4-tier rarity badges.</p>
        </div>

        <div class="main-tab-switcher">
            <button type="button" class="main-tab-btn active" id="btn-tab-rings" onclick="switchShowcaseTab('rings')">
                🖼️ Avatar Rings (<span id="count-rings-pill">255</span>)
            </button>
            <button type="button" class="main-tab-btn" id="btn-tab-banners" onclick="switchShowcaseTab('banners')">
                🎨 Profile Banners (<span id="count-banners-pill">48</span>)
            </button>
        </div>

        <div class="controls-row">
            <input type="text" id="gallery-search" class="search-bar" placeholder="🔍 Search items or tiers..." oninput="filterGallery()">
            
            <div class="filter-btn-group" id="filter-group-container">
                <button type="button" class="toggle-btn active" onclick="setTierFilter('All', this)">All</button>
                <button type="button" class="toggle-btn" style="color:#fbbf24;" onclick="setTierFilter('Legendary', this)">👑 Legendary</button>
                <button type="button" class="toggle-btn" style="color:#c084fc;" onclick="setTierFilter('Epic', this)">💎 Epic</button>
                <button type="button" class="toggle-btn" style="color:#38bdf8;" onclick="setTierFilter('Rare', this)">🔮 Rare</button>
                <button type="button" class="toggle-btn" style="color:#94a3b8;" onclick="setTierFilter('Common', this)">⚪ Common</button>
            </div>

            <div class="density-btn-group">
                <button type="button" class="toggle-btn" onclick="setDensity('density-comfortable', this)">Comfortable</button>
                <button type="button" class="toggle-btn active" onclick="setDensity('density-standard', this)">Standard</button>
                <button type="button" class="toggle-btn" onclick="setDensity('density-compact', this)">Compact</button>
            </div>

            <a href="/" class="back-link-btn">← Back to App</a>
        </div>
    </div>

    <!-- Gallery Container -->
    <div id="gallery-root"></div>

    <script src="data.js"></script>
    <script>
        let currentMode = 'rings'; // 'rings' | 'banners'
        let currentTier = 'All';
        let currentSearch = '';
        let currentDensity = 'density-standard';

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Check URL params for ?tab=banners or ?tab=pfps
        const urlParams = new URLSearchParams(window.location.search);
        const tabParam = urlParams.get('tab');
        if (tabParam === 'banners') {
            currentMode = 'banners';
        } else if (tabParam === 'pfps' || tabParam === 'avatars') {
            currentMode = 'pfps';
        }

        function switchShowcaseTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
            let btnId = 'btn-tab-rings';
            if (mode === 'banners') btnId = 'btn-tab-banners';
            else if (mode === 'pfps') btnId = 'btn-tab-pfps';
            const btn = document.getElementById(btnId);
            if (btn) btn.classList.add('active');
            renderGallery();
        }

        function setDensity(densityClass, btn) {
            currentDensity = densityClass;
            document.querySelectorAll('.density-btn-group .toggle-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderGallery();
        }

        function setTierFilter(tier, btn) {
            currentTier = tier;
            document.querySelectorAll('.filter-btn-group .toggle-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderGallery();
        }

        function filterGallery() {
            currentSearch = (document.getElementById('gallery-search').value || '').trim().toLowerCase();
            renderGallery();
        }

        function renderGallery() {
            const root = document.getElementById('gallery-root');
            if (!root) return;

            const allFrames = (typeof SRM_DATA !== 'undefined' && SRM_DATA.avatarDecorationFrames) ? SRM_DATA.avatarDecorationFrames : [];
            const allBanners = (typeof SRM_DATA !== 'undefined' && SRM_DATA.profileBanners) ? SRM_DATA.profileBanners : [];
            const allPfps = (typeof SRM_DATA !== 'undefined' && SRM_DATA.curatedProfilePics) ? SRM_DATA.curatedProfilePics : [];

            const countRings = document.getElementById('count-rings-pill');
            const countBanners = document.getElementById('count-banners-pill');
            const countPfps = document.getElementById('count-pfps-pill');
            if (countRings) countRings.innerText = allFrames.length;
            if (countBanners) countBanners.innerText = allBanners.length;
            if (countPfps) countPfps.innerText = allPfps.length;

            if (currentMode === 'pfps') {
                let filtered = allPfps;
                if (currentTier !== 'All') {
                    const t = currentTier.toLowerCase();
                    filtered = filtered.filter(p => {
                        const g = (p.gender || '').toLowerCase();
                        const c = (p.category || '').toLowerCase();
                        if (t === 'legendary') return g === 'male' || c.includes('dark');
                        if (t === 'epic') return g === 'female' || c.includes('girl');
                        if (t === 'rare') return g === 'unisex' || c.includes('cyber');
                        return true;
                    });
                }
                if (currentSearch) {
                    filtered = filtered.filter(p => {
                        const n = (p.name || '').toLowerCase();
                        const tag = (p.tag || '').toLowerCase();
                        const cat = (p.category || '').toLowerCase();
                        const g = (p.gender || '').toLowerCase();
                        return n.includes(currentSearch) || tag.includes(currentSearch) || cat.includes(currentSearch) || g.includes(currentSearch);
                    });
                }

                const gridClass = `showcase-grid ${currentDensity === 'density-compact' ? 'density-compact' : (currentDensity === 'density-comfortable' ? 'density-comfortable' : '')}`;
                let html = `
                    <div class="tier-section">
                        <div class="tier-header">
                            <div class="tier-title" style="color:#5865f2;">
                                👤 Curated Anime & Gaming PFPs
                            </div>
                            <span class="tier-count-pill" style="background:rgba(88,101,242,0.15);color:#5865f2;">
                                ${filtered.length} of ${allPfps.length} Avatars
                            </span>
                            <span style="font-size:0.75rem;color:var(--text-sub);margin-left:auto;">Gender-Adaptive Aesthetic Collection</span>
                        </div>
                        <div class="${gridClass}" style="grid-template-columns:repeat(auto-fill,minmax(${currentDensity === 'density-compact' ? '90px' : '110px'},1fr));gap:12px;">
                            ${filtered.map(p => `
                                <div class="frame-card" style="padding:10px;text-align:center;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;" title="${escapeHtml(p.name)} (${p.tag || p.category})">
                                    <div style="width:64px;height:64px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:#18181b;">
                                        <img src="${p.imageSrc}" alt="${escapeHtml(p.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.src='https://cdn.pfps.gg/pfps/88806-anime-guy.png';" />
                                    </div>
                                    <div class="frame-name" style="font-size:0.72rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.name)}</div>
                                    <div style="margin-top:4px;">
                                        <span class="tier-tag" style="background:${p.color || '#5865f2'}22;color:${p.color || '#5865f2'};border:1px solid ${p.color || '#5865f2'}44;font-size:0.55rem;">${escapeHtml((p.tag || p.category).replace(/^[^\w\s]+/, '').trim())}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                root.innerHTML = html;
                return;
            }

            const items = (currentMode === 'rings') ? allFrames : allBanners;

            let filtered = items;
            if (currentTier !== 'All') {
                const t = currentTier.toLowerCase();
                filtered = filtered.filter(f => {
                    const tier = (f.tier || '').toLowerCase();
                    const cat = (f.category || '').toLowerCase();
                    return tier === t || cat === t;
                });
            }

            if (currentSearch) {
                filtered = filtered.filter(f => {
                    const n = (f.name || '').toLowerCase();
                    const tag = (f.tag || '').toLowerCase();
                    const cat = (f.category || '').toLowerCase();
                    const tier = (f.tier || '').toLowerCase();
                    return n.includes(currentSearch) || tag.includes(currentSearch) || cat.includes(currentSearch) || tier.includes(currentSearch);
                });
            }

            const tierGroups = [
                { name: 'Legendary', badge: '👑 Legendary Tier', color: '#fbbf24', bg: 'rgba(251,191,36,0.15)', desc: currentMode === 'rings' ? 'God-Tier Animated Masterpieces & High-Motion Overlays' : 'Mythic Animated Game Banners & 24K Sovereign Realms' },
                { name: 'Epic', badge: '💎 Epic Tier', color: '#c084fc', bg: 'rgba(192,132,252,0.15)', desc: currentMode === 'rings' ? 'High-Energy Anime Power, Cyber Matrix & Celestial Rings' : 'High-Energy Anime Wallpapers, Cyber Synthwave & Cosmic Galaxies' },
                { name: 'Rare', badge: '🔮 Rare Tier', color: '#38bdf8', bg: 'rgba(56,189,248,0.15)', desc: currentMode === 'rings' ? 'Artistic Themed, Elemental Wonders & Aesthetic Florals' : 'Artistic Thematic Wallpapers, Botanical Zen & Lo-Fi Aesthetics' },
                { name: 'Common', badge: '⚪ Common Tier', color: '#94a3b8', bg: 'rgba(148,163,184,0.15)', desc: currentMode === 'rings' ? 'Clean, Subtle Starter Badges & Minimalist Rings' : 'Clean Minimalist Textures & Sleek Obsidian Palettes' }
            ];

            let html = '';

            tierGroups.forEach(tg => {
                const itemsInTier = filtered.filter(f => (f.tier || 'Common').toLowerCase() === tg.name.toLowerCase());
                if (itemsInTier.length === 0) return;

                const gridClass = (currentMode === 'rings')
                    ? `showcase-grid ${currentDensity === 'density-compact' ? 'density-compact' : (currentDensity === 'density-comfortable' ? 'density-comfortable' : '')}`
                    : `banners-showcase-grid ${currentDensity === 'density-compact' ? 'density-compact' : (currentDensity === 'density-comfortable' ? 'density-comfortable' : '')}`;

                html += `
                    <div class="tier-section">
                        <div class="tier-header">
                            <div class="tier-title" style="color:${tg.color};">
                                ${tg.badge}
                            </div>
                            <span class="tier-count-pill" style="background:${tg.bg};color:${tg.color};">
                                ${itemsInTier.length} ${currentMode === 'rings' ? 'Rings' : 'Banners'}
                            </span>
                            <span style="font-size:0.75rem;color:var(--text-sub);margin-left:auto;">${tg.desc}</span>
                        </div>
                        <div class="${gridClass}">
                            ${itemsInTier.map(item => {
                                const tierClass = 'tier-' + (item.tier || 'common').toLowerCase();
                                
                                if (currentMode === 'rings') {
                                    return `
                                        <div class="frame-card ${tierClass}" title="${escapeHtml(item.name)} (${item.tierBadge || item.tier} - ${item.tag || ''})">
                                            <div class="avatar-circle-wrapper">
                                                <div class="avatar-base">
                                                    <span>KP</span>
                                                </div>
                                                <img src="${item.imageSrc}" class="avatar-decoration-overlay" alt="${escapeHtml(item.name)}" loading="lazy" />
                                            </div>
                                            <div class="frame-name">${escapeHtml(item.name)}</div>
                                            <div class="badge-row">
                                                <span class="tier-tag" style="background:${item.tierColor || '#94a3b8'}22;color:${item.tierColor || '#94a3b8'};border:1px solid ${item.tierColor || '#94a3b8'}44;">
                                                    ${item.tierBadge || item.tier}
                                                </span>
                                                <span class="cat-tag">${escapeHtml(item.tag || item.category)}</span>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    const previewBg = item.imageSrc 
                                        ? `background-image: url('${item.imageSrc}');`
                                        : `background: ${item.css || 'var(--accent)'};`;

                                    return `
                                        <div class="banner-card ${tierClass}" title="${escapeHtml(item.name)} (${item.tierBadge || item.tier} - ${item.tag || ''})">
                                            <div class="banner-preview-box" style="${previewBg}"></div>
                                            <div class="banner-name">${escapeHtml(item.name)}</div>
                                            <div class="badge-row">
                                                <span class="tier-tag" style="background:${item.tierColor || '#94a3b8'}22;color:${item.tierColor || '#94a3b8'};border:1px solid ${item.tierColor || '#94a3b8'}44;">
                                                    ${item.tierBadge || item.tier}
                                                </span>
                                                <span class="cat-tag">${escapeHtml(item.tag || item.category)}</span>
                                            </div>
                                        </div>
                                    `;
                                }
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            if (filtered.length === 0) {
                html = `<div style="text-align:center;padding:60px 20px;color:var(--text-sub);">
                    <div style="font-size:2rem;margin-bottom:8px;">🔍</div>
                    <div style="font-size:1.1rem;font-weight:700;color:#fff;">No matching ${currentMode} found</div>
                    <div style="font-size:0.85rem;margin-top:4px;">Try searching for a different name, tier, or clear the search.</div>
                </div>`;
            }

            root.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (currentMode === 'banners') {
                const btn = document.getElementById('btn-tab-banners');
                if (btn) {
                    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            } else if (currentMode === 'pfps') {
                const btn = document.getElementById('btn-tab-pfps');
                if (btn) {
                    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            }
            renderGallery();
        });
    </script>
</body>
</html>
