name: Build & Release SRM Companion APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Compile Android APK & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Node Dependencies
        run: |
          npm ci --prefer-offline || npm install

      - name: 🔄 Sync Web Assets to Android Public Directory
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p www
          cp -rf app.js index.html style.css data.js gallery.html manifest.json version.json android/app/src/main/assets/public/
          cp -rf app.js index.html style.css data.js gallery.html manifest.json version.json www/
          if [ -d "assets" ]; then
            cp -rf assets android/app/src/main/assets/public/
            cp -rf assets www/
          fi
          npx cap sync android || true

      - name: 🔨 Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: 🚀 Compile Production Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Extract Version Metadata
        id: version_info
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])" 2>/dev/null || echo "2.5.0")
          BUILD_DATE=$(date +'%Y-%m-%d')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk SRM_Companion.apk

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRM_Companion-v${{ steps.version_info.outputs.VERSION }}
          path: SRM_Companion.apk
          retention-days: 30

      - name: 🎉 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version_info.outputs.VERSION }}
          name: SRM Companion v${{ steps.version_info.outputs.VERSION }} (${{ steps.version_info.outputs.BUILD_DATE }})
          body: |
            ## 🚀 SRM Companion v${{ steps.version_info.outputs.VERSION }}
            Automated production build generated by GitHub Actions.

            ### ✨ What's New:
            - **Omni-User Dynamic Scraper**: Dynamic multi-student authentication & extraction.
            - **Zero Data Bleed**: Isolated session & cache clearing on login/logout.
            - **Live 360° AI Copilot**: Dynamic student identity, timetable, and attendance injection.
            - **Instant OTA In-App Updates**: Auto-checks GitHub for latest version.

            ### 📲 Direct APK Download:
            - **[Download SRM_Companion.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version_info.outputs.VERSION }}/SRM_Companion.apk)**
          files: |
            SRM_Companion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
