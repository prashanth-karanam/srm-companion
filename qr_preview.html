<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan WhatsApp QR Code</title>
    <style>
        body { background: #000; color: #fff; text-align: center; padding: 40px 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .card { background: #121215; border: 1px solid #282830; border-radius: 20px; display: inline-block; padding: 24px 30px; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        img { border-radius: 12px; background: #fff; padding: 14px; width: 260px; height: 260px; }
        h2 { font-size: 1.25rem; margin-bottom: 12px; font-weight: 700; }
        ol { color: #d4d4d8; font-size: 0.84rem; text-align: left; padding-left: 20px; line-height: 1.6; margin-top: 14px; }
        .badge { background: #22c55e; color: #000; font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 9999px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <div style="margin-bottom:12px;"><span class="badge">Live WhatsApp Link</span></div>
        <h2>Link SRM Companion Bot</h2>
        <img id="qr-img" src="qr_code.png" alt="WhatsApp QR Code">
        <ol>
            <li>Open <b>WhatsApp</b> on your phone</li>
            <li>Tap <b>Linked Devices &gt; Link a Device</b></li>
            <li>Scan the QR code above</li>
        </ol>
    </div>
</body>
</html>
